name: Update writing

on:
  schedule:
    - cron: "17 11 * * *"   # daily
  push:
    paths:
      - writing/linkedin.json
      - scripts/build_writing.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_writing.py
      - name: Commit if changed
        run: |
          git config user.name "Anagh Sinha"
          git config user.email "anaghsinha01@gmail.com"
          git add index.html writing/substack.json
          git diff --cached --quiet || (git commit -m "Update writing" && git push)
